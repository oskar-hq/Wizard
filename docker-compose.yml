services:
  wizard:
    build: .
    image: ${IMAGE_NAME:-wizard-online}:${IMAGE_TAG:-latest}
    # Überschreibbar, damit sich eine Testinstanz parallel betreiben lässt.
    container_name: ${CONTAINER_NAME:-wizard-online}
    restart: unless-stopped
    environment:
      # Port im Container UND nach außen – einfach hier ändern.
      PORT: ${PORT:-3000}
      NODE_ENV: production
      # Optional: Anzeigedauer eines fertigen Stichs bzw. der Rundenwertung (ms)
      # WIZARD_TRICK_MS: 2600
      # WIZARD_ROUND_MS: 15000
    ports:
      # Nur auf localhost binden – nach außen geht es über den Cloudflare Tunnel.
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s
